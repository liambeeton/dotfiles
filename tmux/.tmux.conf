# Based on dev-accelerator by Satyam Soni (MIT).
# Press prefix + I once to install the plugins listed at the bottom.

# ---- General ----

# True color, including under Ghostty (TERM=xterm-ghostty)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:RGB"

set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# ---- Key bindings ----

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -, in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Copy mode with vi keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ---- Status bar ----

set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'

set -g status-left-length 50
set -g status-left '#[fg=#7aa2f7,bold] #H~#S #[fg=#565f89]|'

set -g status-right-length 100
set -g status-right '#[fg=#565f89]| #[fg=#9ece6a]%H:%M #[fg=#565f89]| #[fg=#bb9af7]%d-%b'

setw -g window-status-format '#[fg=#565f89] #I:#W '
setw -g window-status-current-format '#[fg=#7aa2f7,bold] #I:#W '

set -g message-style 'bg=#1a1b26 fg=#7aa2f7 bold'

# ---- Panes ----

# Dim inactive panes so it is obvious which has focus
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour255,bg=colour234'

set -g pane-border-style "fg=colour238 bg=default"
set -g pane-active-border-style "fg=blue bg=default"
set -g pane-border-format ' #[bold]#P #[default]#{?pane_title,#{pane_title},#{pane_current_command}} '
set -g pane-border-status top

# ---- Plugins ----

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Keep at the bottom
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' "run '~/.tmux/plugins/tpm/tpm'"
