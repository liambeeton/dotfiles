# Balanced user defaults.
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "low"
personality = "pragmatic"
web_search = "cached"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
model = "gpt-6-astra"

notify = ["/Users/liam/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch"]
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 4

[projects."/Users/liam/.dotfiles"]
trust_level = "trusted"

[desktop]
followUpQueueMode = "steer"
avatar-overlay-pet-visible = false
